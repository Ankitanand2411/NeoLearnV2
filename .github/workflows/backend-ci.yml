name: backend-ci

# Runs lint + unit/contract tests for the FastAPI backend on every push and PR
# (no path filter, so it can be a required status check). No secrets are needed: tests/conftest.py sets fake env vars
# and every external service (Groq, Supabase, Redis) is replaced with a fake.
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -q
