line-length = 110
target-version = "py312"
extend-exclude = [".venv", "venv"]

[lint]
# E/W = pycodestyle, F = pyflakes, I = import sorting, B = common bug patterns
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]  # long lines in prompts are fine

[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security", "fastapi.params.Depends"]
